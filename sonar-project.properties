# SonarQube Cloud — VisualMath AI
# Project + organisasi diambil dari dashboard SonarCloud (org personal GitHub).
sonar.projectKey=briannnn327_visualmath-ai
sonar.projectName=visualmath-ai
sonar.organization=briannnn327

# Source
sonar.sources=src
# src/generated/prisma = hasil `prisma generate` (~28k baris), bukan kode yang ditulis manusia.
# Wajib dikecualikan agar metrik duplikasi/issue/coverage tidak tercemar.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/generated/**,**/*.d.ts

# TypeScript
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Analysis
sonar.qualitygate.wait=true
sonar.verbose=false

# Coverage: unit test hanya menyasar logika murni di src/lib.
# UI, route handler, hook data-fetching, dan adapter integrasi (DB/pgvector/AI)
# tidak dihitung sebagai new coverage karena diuji lewat E2E/manual, bukan Vitest.
# File logika baru (mis. math/answer.ts, server/material-scope.ts, store/exerciseStore.ts)
# tetap wajib tercakup dan diuji.
sonar.coverage.exclusions=src/lib/db/**,src/lib/hooks/**,src/lib/services/**,src/lib/types.ts,src/lib/ai/rag.ts,src/lib/server/data.ts,src/lib/server/exercise-ai.ts,src/app/**,src/components/**