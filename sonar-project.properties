# SonarQube Cloud — VisualMath AI
sonar.projectKey=visualmath-ai
sonar.projectName=VisualMath AI
sonar.organization=uns-sv-ti

# Source
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Analysis
sonar.qualitygate.wait=true
sonar.verbose=false

# Coverage thresholds (target gate: coverage >= 80%, duplication <= 3%)
sonar.coverage.exclusions=src/lib/db/**