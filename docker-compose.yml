# Docker Compose — PostgreSQL + pgvector untuk VisualMath AI.
# Volume bernama "visualmath_pgdata" dipertahankan (external) agar data lama tetap ada.
# Jalankan: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: visualmath-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: visualmath
      POSTGRES_PASSWORD: visualmath
      POSTGRES_DB: visualmath
      PGDATA: /var/lib/postgresql/data
      # Collation deterministik (byte-wise) → menghindari bug FK/perbandingan teks
      # setelah container di-recreate dengan libc berbeda. Hanya berlaku untuk volume BARU.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - visualmath_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visualmath -d visualmath"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  visualmath_pgdata:
    name: visualmath_pgdata
    external: true
