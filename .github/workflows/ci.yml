name: CI — VisualMath AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://user:pass@localhost:5432/visualmath

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 = LTS aktif. Minimal 22.19.0 karena undici@8 (via jsdom) butuh
          # createZstdDecompress dari node:zlib yang baru ada di Node >= 22.15.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts

      - name: Lint (ESLint)
        run: npm run lint

      - name: Biome check (Rust toolchain)
        run: npm run check

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest + coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  sonar-scan:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    env:
      # Default SonarCloud; bisa dioverride lewat secret bila memakai SonarQube Server.
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts

      - name: Unit tests with coverage (for Sonar)
        run: npm run test:coverage

      - name: SonarQube Cloud Scan
        # Lewati bila SONAR_TOKEN belum di-set, biar log tidak menyesatkan.
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@v8
