name: Sonar Won't Fix (temporary)

on:
  workflow_dispatch:

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Transition S6845 issues to Won't Fix
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e
          for key in AaFjt7L6Esbo9kpBFirN AaFjt7L1Esbo9kpBFirM; do
            echo "Transitioning $key"
            curl -sS -f -X POST \
              -H "Authorization: Bearer $SONAR_TOKEN" \
              "https://sonarcloud.io/api/issues/do_transition?issue=${key}&transition=wontfix"
            echo
          done
